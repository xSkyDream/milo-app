<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3efff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Milo">
<meta name="description" content="Milo, ton compagnon de convalescence : traitements, soins, rendez-vous et un assistant qui t’accompagne chaque jour.">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Milo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout : une seule app — barre latérale sur ordinateur, barre d'onglets sur mobile (container query sur #app). Identité claire lavande assumée (pas de thème sombre : les avatars de Milo sont pensés pour fond clair). */
:root{
  --bg:#f5f2ff; --bg-2:#fbfaff; --surface:#ffffff; --surface-2:#f8f6ff;
  --ink:#1b1842; --ink-2:#3a3466; --muted:#716c8e; --line:#ebe6f8;
  --violet:#7347ee; --violet-2:#9a66f7; --blue:#3d6df3; --lav:#eee8ff; --lav-2:#ded4fb;
  --green:#1f9a5f; --green-bg:#daf5e7; --pink:#d9468f; --pink-bg:#ffe7f2; --orange:#c9821e; --orange-bg:#fff0d8; --sky:#3d6df3; --sky-bg:#e7eeff;
  --grad:linear-gradient(110deg,#3f73f4 0%,#6c4cf1 58%,#a46cf5 100%);
  --grad-btn:linear-gradient(105deg,#985df6,#6a3ef0);
  --shadow:0 6px 18px rgba(67,47,135,.09); --shadow-lg:0 18px 50px rgba(52,36,120,.16);
  --desk:#e6e0f7;
  --font:"Nunito","Avenir Next","SF Pro Rounded","Segoe UI",system-ui,sans-serif;
  --r:20px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
/* iPhone : Safari zoome tout seul sur un champ dont le texte fait moins de 16 px, et la page reste zoomée ensuite.
   16 px minimum sur les champs (appareils tactiles uniquement) + pas de zoom au double-tap ni de débordement horizontal. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
html,body{overflow-x:hidden;max-width:100%}
@media (pointer:coarse){input:not([type=checkbox]):not([type=radio]):not([type=range]),select,textarea{font-size:16px!important}}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--font);font-weight:600;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #9a66f7;outline-offset:2px;border-radius:10px}
h1,h2,h3{margin:0;text-wrap:balance}
img{max-width:100%}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Shell ---------- */
#app{position:relative;height:100%;display:flex;overflow:hidden;container:app/inline-size;background:linear-gradient(160deg,#f1ecff 0%,#fbfaff 45%,#f3efff 100%)}
.side{width:256px;flex:none;display:flex;flex-direction:column;gap:6px;padding:22px 16px;background:rgba(255,255,255,.72);border-right:1px solid var(--line);backdrop-filter:blur(14px)}
.logo{display:flex;align-items:center;gap:11px;padding:4px 8px 18px}
.logo img{width:42px;height:42px;border-radius:12px;box-shadow:0 6px 14px rgba(80,60,220,.28)}
.logo b{font-size:25px;font-weight:900;letter-spacing:-.8px;color:#211d50}
.logo small{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.2px;margin-top:-2px}
.side-nav{display:flex;flex-direction:column;gap:3px}
.side-nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:11px 12px;border-radius:14px;color:var(--ink-2);font-weight:800;font-size:14.5px;text-align:left}
.side-nav button:hover{background:var(--lav)}
.side-nav button.on{background:var(--grad-btn);color:#fff;box-shadow:0 6px 14px rgba(121,80,239,.28)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.side-milo{background:var(--surface);border-radius:18px;padding:12px;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
.side-milo img{width:64px;height:64px;object-fit:contain}
.side-milo p{margin:0;font-size:12.5px;line-height:1.35;color:var(--ink-2)}
.preview-btn{display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed #cbbdf5;background:transparent;border-radius:14px;padding:10px;color:var(--violet);font-weight:800;font-size:13px}
.main{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.view{max-width:1140px;margin:0 auto;padding-block:30px 48px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));animation:appear .22s ease}
@keyframes appear{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-4px) scale(1.14)}100%{transform:none}}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.view.sr{animation:slideR .42s cubic-bezier(.22,1,.36,1)}
.view.sl{animation:slideL .42s cubic-bezier(.22,1,.36,1)}
.view.fd{animation:appear .25s ease}
.tabbar{display:none}
.sb{display:none}

/* ---------- Composants ---------- */
.card{background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.95);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.sub{font-size:14px;color:var(--muted);line-height:1.45}
.tiny{font-size:12.5px;color:var(--muted);line-height:1.4}
.h-title{font-size:30px;font-weight:900;letter-spacing:-.8px}
.h-sec{font-size:18px;font-weight:900;letter-spacing:-.3px}
.h-card{font-size:15.5px;font-weight:900;letter-spacing:-.15px;line-height:1.25}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.sec-head:first-child{margin-top:0}
.link{border:0;background:none;color:var(--violet);font-weight:800;font-size:13.5px;padding:4px 2px}
.btn{border:0;border-radius:30px;padding:12px 20px;color:#fff;background:var(--grad-btn);font-weight:800;font-size:14.5px;box-shadow:0 6px 14px rgba(121,80,239,.26);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn.full{width:100%}
.btn.ghost{background:var(--surface);color:var(--violet);border:1px solid #e3dafb;box-shadow:none}
.btn.danger{background:#fff;color:#c23a5e;border:1px solid #f6d3dd;box-shadow:none}
.btn.sm{padding:8px 14px;font-size:13px}
.auth-g{background:#fff;color:#1f1f1f;border:1px solid #dcd6ef;box-shadow:0 2px 6px rgba(40,30,90,.08);gap:10px}
.auth-a{background:#111;color:#fff;gap:10px}.auth-a[disabled]{opacity:.45;cursor:not-allowed}
.auth-or{display:flex;align-items:center;gap:10px;margin:16px 0 10px;color:var(--muted);font-size:12.5px;font-weight:800}.auth-or:before,.auth-or:after{content:"";flex:1;height:1px;background:var(--line)}
.acc-card{width:100%;text-align:left;border:0}
.acc-cta{background:linear-gradient(120deg,#fff,#f3eeff);box-shadow:0 8px 20px rgba(110,70,230,.12),inset 0 0 0 1.5px #e2d8ff}
.acc-av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:900;font-size:19px;color:#fff;background:linear-gradient(140deg,#9d66f7,#4b63f2)}
.acc-st{color:var(--violet);font-weight:800;margin-top:2px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.9);display:grid;place-items:center;color:var(--ink-2);box-shadow:0 2px 10px rgba(92,67,165,.12);flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:30px;padding:5px 11px;font-size:12px;font-weight:900;background:var(--lav);color:var(--violet);white-space:nowrap;border:0}
.pill.green{background:var(--green-bg);color:var(--green)}
.pill.pink{background:var(--pink-bg);color:var(--pink)}
.pill.orange{background:var(--orange-bg);color:var(--orange)}
.pill.sky{background:var(--sky-bg);color:var(--sky)}
.pill.grey{background:#efedf5;color:#77718f}
button.pill{cursor:pointer}
.bubble{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--lav);color:var(--violet);flex:none}
.bubble.pink{background:var(--pink-bg);color:var(--pink)}.bubble.orange{background:var(--orange-bg);color:var(--orange)}.bubble.sky{background:var(--sky-bg);color:var(--sky)}.bubble.green{background:var(--green-bg);color:var(--green)}
.bubble img{width:40px;height:40px;object-fit:contain}
.bubble .acc{width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(66,46,149,.18))}
.bubble .art{width:40px;height:40px;overflow:visible}
.stat .bubble .art{width:32px;height:32px}
.bubble.img{background:linear-gradient(145deg,#f4f0ff,#e6defd)}
.chev{color:#a29cc0}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f0ecf8;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.list-row:last-child{border-bottom:0}
button.list-row:hover .chev{color:var(--violet)}
.vbtn{width:34px;height:34px;border-radius:50%;border:2px solid #d9cff8;background:#fff;color:#c9bdf3;display:grid;place-items:center;flex:none;padding:0;transition:background .25s,border-color .25s,color .25s,transform .35s cubic-bezier(.34,1.7,.5,1),box-shadow .25s}
.vbtn .ic{width:17px;height:17px;stroke-width:3}
.vbtn:hover{border-color:#a98bf6;color:#a98bf6}
.vbtn:active{transform:scale(.88)}
.vbtn.on{background:linear-gradient(140deg,#35c27f,#1f9a5f);border-color:transparent;color:#fff;box-shadow:0 4px 10px rgba(31,154,95,.3);animation:vpop .45s cubic-bezier(.34,1.7,.5,1)}
@keyframes vpop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.vdone{font-size:12.5px;font-weight:800;color:var(--green);margin-right:2px;font-variant-numeric:tabular-nums}
.progress{height:8px;border-radius:20px;background:var(--lav-2);overflow:hidden}
.progress>i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,#8654f4,#5f3ae9)}
.mascot{object-fit:contain;filter:drop-shadow(0 6px 10px rgba(66,46,149,.16));flex:none;user-select:none;-webkit-user-drag:none}
.speech{position:relative;background:var(--surface);border-radius:18px;padding:13px 15px;box-shadow:var(--shadow);font-size:14px;line-height:1.45;color:var(--ink-2)}
.note{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:var(--muted);background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.note .ic{width:16px;height:16px;margin-top:1px;color:var(--violet)}
.empty{text-align:center;padding:16px;color:var(--muted);font-size:14px}
.tabs{display:flex;padding:4px;border-radius:30px;background:#ece6fa;gap:4px}
.tabs button{flex:1;border:0;border-radius:25px;background:transparent;color:#6c6789;font-size:14px;font-weight:800;padding:10px 14px}
.tabs button.on{background:var(--grad-btn);color:#fff;box-shadow:0 4px 10px rgba(124,83,235,.25)}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.home-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:22px;align-items:start}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.page-head .h-title{flex:1}
.back{display:none}
.m-only{display:none}

/* Hero convalescence */
.hero{border-radius:22px;background:var(--grad);color:#fff;padding:20px 22px;position:relative;overflow:hidden;box-shadow:0 12px 26px rgba(118,82,233,.28);min-height:150px}
.hero:after{content:"";position:absolute;right:-60px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%)}
.hero .cap{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:900;opacity:.95}
.hero .big{font-size:40px;font-weight:900;letter-spacing:-1.4px;margin-top:6px;line-height:1}
.hero .big span{font-size:16px;font-weight:700;letter-spacing:0}
.hero .progress{background:rgba(255,255,255,.3);margin-top:14px;width:70%}
.hero .progress i{background:#fff}
.hero .meta b{white-space:nowrap}
.hero .meta{display:flex;align-items:flex-end;gap:10px;justify-content:space-between;width:70%;font-size:12.5px;margin-top:8px;opacity:.95}
.hero img{position:absolute;right:6px;bottom:-14px;width:150px;height:150px;z-index:1}

/* Bienvenue */
.welcome{position:absolute;inset:0;z-index:40;background:linear-gradient(165deg,#eee8ff 0%,#fff 50%,#f1ecff 100%);display:flex;align-items:center;justify-content:center;padding:30px max(20px,env(safe-area-inset-left,0px));overflow:auto}
.welcome-in{width:min(100%,420px);text-align:center;display:flex;flex-direction:column;align-items:center;margin:auto 0}
.welcome .brand{font-size:52px;font-weight:900;letter-spacing:-2px;color:#211d50;line-height:1}
.welcome .tag{font-size:20px;line-height:1.3;font-weight:800;margin-top:8px;color:var(--ink)}
.welcome .stage{position:relative;width:270px;height:250px;display:grid;place-items:center;margin:20px 0 8px}
.welcome .stage:before{content:"";position:absolute;inset:6% 2%;border-radius:50%;background:radial-gradient(ellipse,#d6caff 0%,#e7dfff 45%,transparent 72%)}
.welcome .stage img{position:relative;width:250px;height:250px;animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.dots{display:flex;gap:8px;margin:6px 0 22px}
.dots button{width:9px;height:9px;border-radius:50%;border:0;background:#d5c9fa;padding:0}
.dots button.on{background:var(--violet);width:24px;border-radius:9px}
.welcome .lead{font-size:15px;color:var(--muted);line-height:1.5;margin:0 0 18px;min-height:46px}

/* Calendrier */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .wd{font-size:12px;color:var(--muted);padding:6px 0;font-weight:800}
.cal button{border:0;background:none;border-radius:12px;padding:9px 0 13px;font-size:14.5px;font-weight:800;position:relative;color:var(--ink)}
.cal button:hover{background:var(--lav)}
.cal button.today{color:var(--violet);box-shadow:inset 0 0 0 2px #d9ccfb}
.cal button.sel{background:var(--violet);color:#fff;box-shadow:none}
.cal button.out{color:#c3bed5}
.cal .dz{position:absolute;bottom:4px;left:0;right:0;display:flex;gap:3px;justify-content:center}
.cal .dz i{width:5px;height:5px;border-radius:50%}
.dot{width:10px;height:10px;border-radius:50%;flex:none}

/* Récupération */
.ring{width:210px;height:210px;margin:6px auto 0;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring strong{font-size:44px;font-weight:900;letter-spacing:-1.5px;line-height:1}
.stat{text-align:center;padding:14px 8px}
.stat .bubble{margin:0 auto 8px;width:40px;height:40px;border-radius:13px}
.stat b{display:block;font-size:19px;font-weight:900;letter-spacing:-.4px}
.timeline{position:relative;padding-left:22px}
.timeline:before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--lav-2);border-radius:2px}
.tl{position:relative;padding:8px 0}
.tl:before{content:"";position:absolute;left:-21px;top:13px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--violet)}
.tl.done:before{background:var(--violet)}

/* Milo chat */
.talk{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
.talk-side{position:sticky;top:0;text-align:center}
.voice{width:210px;height:210px;border-radius:50%;margin:8px auto 14px;background:radial-gradient(circle,#fff 44%,#ece4ff 45%,#f3efff 64%,#ddd0ff 65%,#f6f2ff 78%);display:grid;place-items:center;box-shadow:0 8px 22px rgba(128,96,223,.14);position:relative}
.voice img{width:150px;height:150px;transition:transform .3s}
.voice.think img{animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.waves{position:absolute;top:50%;display:flex;gap:4px;align-items:center;transform:translateY(-50%)}
.waves i{width:3px;border-radius:3px;background:#b9a3f6;display:block}
.waves.l{left:-26px}.waves.r{right:-26px}
.chat{display:flex;flex-direction:column;min-height:540px}
.msgs{display:flex;flex-direction:column;gap:12px;padding:4px 2px 12px}
.msg{max-width:84%;padding:12px 15px;border-radius:18px;font-size:14.5px;line-height:1.5;white-space:pre-line}
.msg.me{align-self:flex-end;background:var(--grad-btn);color:#fff;border-bottom-right-radius:6px}
.msg.milo{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:6px;color:var(--ink-2)}
.msg.milo b{color:var(--ink)}
.msg-wrap{display:flex;gap:8px;align-items:flex-end}
.msg-wrap img{width:36px;height:36px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.chip{border:1px solid #e2d9fb;background:var(--surface);color:var(--violet);border-radius:30px;padding:8px 13px;font-size:13px;font-weight:800}
.chip:hover{background:var(--lav)}
.composer{display:flex;gap:8px;align-items:center;background:var(--surface);border-radius:30px;padding:6px 6px 6px 16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.composer input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px;padding:8px 0}
.mic{width:44px;height:44px;border-radius:50%;border:0;background:var(--grad-btn);color:#fff;display:grid;place-items:center;box-shadow:0 5px 12px rgba(128,84,239,.35);flex:none}

/* Profil */
.p-hero{border-radius:22px;background:linear-gradient(105deg,#4d7ff2,#7849e9 60%,#b672ef);color:#fff;display:flex;align-items:center;gap:6px;overflow:hidden;padding:10px 18px 10px 8px;min-height:120px;box-shadow:0 12px 26px rgba(118,82,233,.26)}
.p-hero .av{width:112px;height:112px;display:grid;place-items:center;flex:none}
.p-hero .av img{width:108px;height:108px;filter:drop-shadow(0 8px 14px rgba(40,20,120,.32))}
.p-hero b{font-size:26px;font-weight:900;letter-spacing:-.6px}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0;z-index:1}
.switch span{position:absolute;inset:0;border-radius:20px;background:#ddd8ea;transition:.2s}
.switch span:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.18);transition:.2s}
.switch input:checked+span{background:var(--violet)}
.switch input:checked+span:after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:3px solid #9a66f7;outline-offset:2px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.g-item{background:var(--surface);border-radius:16px;padding:8px;text-align:center;font-size:12px;color:var(--muted);box-shadow:var(--shadow)}
.g-item img{width:100%;aspect-ratio:1;object-fit:contain}
.g-item{content-visibility:auto}

/* Formulaires / modale */
.modal{position:absolute;inset:0;z-index:60;background:rgba(23,19,49,.42);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px);animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(100%,520px);max-height:calc(100% - 20px);overflow:auto;border-radius:26px;background:var(--bg-2);padding:20px;box-shadow:var(--shadow-lg);animation:up .22s ease}
@keyframes up{from{transform:translateY(18px);opacity:.5}}

function medStatus(m){const t=TODAY();if(m.start&&t<m.start)return{l:`Commence le ${fmtS(m.start)}`,c:'grey'};const e=medEnd(m);if(e&&t>e)return{l:'Terminé',c:'grey'};const left=e?diff(t,e):null;
  if(left===0)return{l:'Dernier jour',c:'pink'};if(left)return{l:`Jusqu’au ${fmtS(e)}`,c:''};return{l:'En cours',c:'green'}}
const ik=(id,day,slot)=>`${id}|${day}|${slot}`;
function todayDoses(){const t=TODAY(),out=[];S.meds.filter(m=>medActive(m,t)&&medOnDay(m,t)).forEach(m=>(m.slots||[]).forEach(s=>out.push({m,slot:s,taken:S.intakes[ik(m.id,t,s)]})));return out.sort((a,b)=>slotMin(a.slot)-slotMin(b.slot))}
function dressingDates(){const r=[],lim=addDays(maxDate(),14);let d=S.dressing.first;const n=Math.max(1,Number(S.dressing.every)||5);let i=0;while(d<=lim&&i<60){r.push(d);d=addDays(d,n);i++}return r}
function nextDressing(){const t=TODAY();return dressingDates().find(d=>d>=t&&!S.dressing.done.includes(d))||null}
function maxDate(){const p=S.profile;return [p.stitches,p.workEnd,p.immobEnd].filter(Boolean).sort().pop()||TODAY()}
function nurseOn(day){const p=S.profile;if(day<p.surgery)return false;const u=S.nurse.until;return u?day<=u:true}
function progress(){const p=S.profile,t=TODAY(),total=Math.max(1,diff(p.surgery,p.immobEnd)),el=Math.min(Math.max(diff(p.surgery,t),0),total);return{total,elapsed:el,left:Math.max(diff(t,p.immobEnd),0),pct:Math.round(el/total*100)}}
const KIND={pansement:{l:'Pansement',c:'#e5a23a',t:'orange',i:'bandage'},fils:{l:'Retrait des fils',c:'#c457d8',t:'pink',i:'scissors'},rdv:{l:'Rendez-vous',c:'#3d6df3',t:'sky',i:'stethoscope'},arret:{l:'Arrêt de travail',c:'#2fb371',t:'green',i:'briefcase'},immob:{l:'Immobilisation',c:'#7347ee',t:'',i:'footprints'},med:{l:'Traitement',c:'#e0529c',t:'pink',i:'pill'},op:{l:'Opération',c:'#7347ee',t:'',i:'activity'},soin:{l:'Soin',c:'#7347ee',t:'',i:'syringe'},perso:{l:'Personnel',c:'#8a68ee',t:'',i:'calendar'}};
function allEvents(){const p=S.profile,e=[];
  e.push({date:p.surgery,title:p.intervention||'Opération',kind:'op',sys:1});
  dressingDates().forEach((d,i)=>e.push({date:d,title:i===0?'Premier changement des pansements':'Changement des pansements',kind:'pansement',sys:1,done:S.dressing.done.includes(d),dressing:1}));
  if(p.stitches)e.push({date:p.stitches,title:'Retrait des fils',kind:'fils',sys:1});
  if(p.workEnd)e.push({date:p.workEnd,title:'Fin de l’arrêt de travail',kind:'arret',sys:1});
  if(p.immobEnd)e.push({date:p.immobEnd,title:p.immobConfirmed?'Fin d’immobilisation':'Fin d’immobilisation (à confirmer)',kind:'immob',sys:1});
  S.meds.forEach(m=>{const en=medEnd(m);if(en)e.push({date:en,title:`Dernier jour · ${m.name}`,kind:'med',sys:1})});
  S.care.forEach(c=>e.push({date:c.date,time:c.time,title:c.title,kind:'soin',note:c.note,careId:c.id}));
  S.events.forEach(x=>e.push({...x,user:1}));
  return e.sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')))}
const upcoming=(n=5)=>allEvents().filter(e=>e.date>=TODAY()&&!e.done).slice(0,n);
function miloMood(){const h=new Date().getHours();if(h<11)return{k:'n_heureux',t:`Bien dormi, ${S.profile.name} ?`,s:'Petit-déjeuner, traitement du matin, et on attend l’infirmier entre 10 h et 11 h.'};if(h<18)return{k:'n_coucou',t:'Tu avances bien !',s:'Chaque étape compte. Continue à suivre ton programme de soins.'};if(h<21)return{k:'n_serein',t:'Belle journée de récup',s:'Pense à ta prise du soir pendant le repas.'};return{k:'fatigue',t:'C’est l’heure de se reposer',s:'Le sommeil fait partie du traitement. À demain !'}}

const NB={R:29,CY:4,GAP:7,F:15,RC:28};
function buildTabbar(){const t=document.getElementById('tabbar');
  t.innerHTML='<svg class="nav-bg" aria-hidden="true"><defs><linearGradient id="navGrad" x1="3" y1="3" x2="21" y2="21" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8d55f5"/><stop offset="1" stop-color="#3d6df3"/></linearGradient><linearGradient id="navFill" x1="3" y1="3" x2="21" y2="21" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#a58bff"/><stop offset="1" stop-color="#6d8cf8"/></linearGradient></defs><path/></svg><span class="tab-ind" aria-hidden="true"><i></i></span>'+
   TABS.map(([r,l])=>l?`<button data-go="${r}" data-tab="${r}" aria-label="${l}"><span class="nv">${navSvg(r)}</span><span class="lb">${l}</span></button>`:`<button class="add" data-go="milo" data-tab="milo" aria-label="Parler avec Milo">${navSvg('milo')}</button>`).join('');

/* barre arrondie dont le bord haut se creuse en arc autour du bouton central, raccordé par deux congés */
function navPath(w,h){const r=Math.min(NB.RC,h/2),cx=w/2,cy=NB.CY,A=NB.R+NB.GAP,f=NB.F,n=v=>v.toFixed(2);
  const D=A+f,dx=Math.sqrt(D*D-(f-cy)*(f-cy)),k=f/D,tx=dx*(1-k),ty=f+(cy-f)*k;
  return `M${r},0 L${n(cx-dx)},0 A${f},${f} 0 0 1 ${n(cx-tx)},${n(ty)} A${A},${A} 0 0 0 ${n(cx+tx)},${n(ty)} A${f},${f} 0 0 1 ${n(cx+dx)},0 L${n(w-r)},0 A${r},${r} 0 0 1 ${w},${r} L${w},${n(h-r)} A${r},${r} 0 0 1 ${n(w-r)},${h} L${r},${h} A${r},${r} 0 0 1 0,${n(h-r)} L0,${r} A${r},${r} 0 0 1 ${r},0 Z`}
function paintInd(){const t=document.getElementById('tabbar');if(!t)return;const ind=t.querySelector('.tab-ind'),svg=t.querySelector('.nav-bg'),w=t.clientWidth,h=t.clientHeight;
  if(svg._w!==w||svg._h!==h){svg._w=w;svg._h=h;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.querySelector('path').setAttribute('d',navPath(w,h))}
  const sp=Math.abs(SP.v),sx=1+Math.min(.28,sp/2200),sy=1-Math.min(.12,sp/6000);
  ind.style.transform=`translate3d(${(SP.x-23).toFixed(2)}px,${(h/2-23).toFixed(2)}px,0) scale(${sx.toFixed(3)},${sy.toFixed(3)})`}
function springStep(t){const dt=Math.min(.034,SP.last?(t-SP.last)/1000:.016);SP.last=t;
  const n=4,h=dt/n;for(let i=0;i<n;i++){const a=340*(SP.tx-SP.x)-25*SP.v;SP.v+=a*h;SP.x+=SP.v*h}
  paintInd();
  if(Math.abs(SP.v)<3&&Math.abs(SP.tx-SP.x)<.25){SP.x=SP.tx;SP.v=0;paintInd();SP.raf=0;SP.last=0;return}
  SP.raf=requestAnimationFrame(springStep)}
function moveInd(snap=false){const t=document.getElementById('tabbar'),ind=t&&t.querySelector('.tab-ind');if(!ind)return;const cur=tabOf(route);
  t.querySelectorAll('[data-tab]').forEach(b=>{const on=b.dataset.tab===cur;b.classList.toggle('on',on);on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});
  const b=t.querySelector(`[data-tab="${cur}"]:not(.add)`);ind.classList.toggle('off',!b);
  if(!t.offsetWidth)return;const tr=t.getBoundingClientRect();
  if(b){const r=b.getBoundingClientRect();SP.tx=r.left-tr.left+r.width/2}else if(SP.x===null)SP.tx=tr.width/2;
  if(snap||SP.x===null||RM()){cancelAnimationFrame(SP.raf);SP.raf=0;SP.x=SP.tx;SP.v=0;paintInd();return}
  if(!SP.raf){SP.last=0;SP.raf=requestAnimationFrame(springStep)}}

/* Version hébergée (Vercel) : même interface que claude.use('sample'), via /api/chat → API Anthropic, outils exécutés ici. */
async function remoteSample(input,opts={}){const sys=input[0].content,msgs=[];
  for(const t of input.slice(1)){const last=msgs[msgs.length-1];if(last&&last.role===t.role&&typeof last.content==='string')last.content+='\n\n'+t.content;else msgs.push({role:t.role,content:t.content})}
  const tools=(opts.tools||[]).map(t=>({name:t.name,description:t.description,input_schema:t.inputSchema||{type:'object',properties:{}}}));
  let text='',truncated=false;
  for(let round=0;round<5;round++){let r;
    try{r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:sys,messages:msgs,tools}),signal:opts.signal})}
    catch(e){throw {code:e&&e.name==='AbortError'?'cancelled':'upstream_error',message:String(e),text:text||undefined}}
    if(r.status===503)throw {code:'not_granted',message:'clé API absente'};
    if(r.status===429)throw {code:'rate_limited',message:'quota'};
    if(!r.ok)throw {code:'upstream_error',message:'HTTP '+r.status,text:text||undefined};
    const d=await r.json();const blocks=d.content||[];
    const t=blocks.filter(b=>b.type==='text').map(b=>b.text).join('');if(t){text+=(text?'\n\n':'')+t;opts.onText&&opts.onText({text,delta:t})}
    if(d.stop_reason==='max_tokens')truncated=true;
    const uses=blocks.filter(b=>b.type==='tool_use');if(d.stop_reason!=='tool_use'||!uses.length)break;
    msgs.push({role:'assistant',content:blocks});
    const results=[];for(const u of uses){const tool=(opts.tools||[]).find(x=>x.name===u.name);let out,err=false;
      try{out=tool?await tool.execute(u.input||{},{signal:opts.signal}):'outil inconnu';if(!tool)err=true}catch(e){out='Error: '+(e&&e.message||e);err=true}
      results.push({type:'tool_result',tool_use_id:u.id,content:typeof out==='string'?out:JSON.stringify(out),is_error:err})}
    msgs.push({role:'user',content:results})}
  if(!text.trim())throw {code:'empty_completion',message:'réponse vide'};
  return {text,truncated}}

- Tu n’es pas médecin : pas de diagnostic, pas de prescription.
- Ne modifie jamais une posologie. Ne propose ni dose, ni arrêt, ni ajout de médicament, ni association. Pour une question de dose, d’oubli de prise ou d’interaction : ordonnance, pharmacien ou médecin.
- Signes d’alerte après une opération : douleur qui augmente ou inhabituelle, mollet chaud, gonflé ou douloureux, fièvre, plaie rouge, chaude, qui suinte ou saigne, engourdissement, malaise. Dis clairement de contacter rapidement son médecin ou son chirurgien. Essoufflement brutal ou douleur dans la poitrine : appeler le 15 (ou le 112) immédiatement.
- Détresse morale importante : réponds avec empathie, encourage à en parler à un proche ou à un professionnel ; en cas d’idées noires, le 3114 (24 h/24) ou le 15 en cas de danger immédiat.
- Pour les dates, traitements et soins, appuie-toi uniquement sur les données de l’app ci-dessous. Si une information manque, dis-le simplement.
Conversation : tu échanges par écrit, dans la continuité. Ne te présente pas et ne salue pas à chaque message (seulement si ${n} te salue ou au premier échange de la journée). Ne répète pas ce que tu as déjà dit, ne reformule pas la question. Appuie-toi sur l’historique, le résumé et la mémoire quand ${n} fait référence à un échange passé (« comme je t’ai dit », « hier »), et reste cohérent avec tes réponses précédentes ; si tu t’es trompé, corrige-toi simplement. Tiens compte du temps écoulé entre deux messages (horodatages). Une seule question à la fois, et seulement si elle est utile. Les horodatages entre crochets au début des messages de ${n} sont des repères : ne les recopie jamais.
Style : réponses courtes (2 à 5 phrases, ou une petite liste de 3 points maximum), naturelles, sans titres ni tableaux. Commence TOUJOURS par une humeur entre crochets parmi [heureux] [clin] [alerte] [determine] [amour] [sommeil] [face] : alerte pour un signe d’alerte, sommeil pour la fatigue et le repos, amour pour le soutien moral, determine pour l’organisation.
Mémoire : quand ${n} te confie une information durable utile pour l’accompagner (douleur récurrente, sommeil, moral, préférences, habitudes, entourage, inquiétudes, progrès, objectifs), appelle l’outil remember avec une phrase courte à la troisième personne. N’enregistre ni ce qui est déjà en mémoire ni les données déjà présentes dans l’app. Si ${n} te demande d’oublier quelque chose, utilise forget. Si une information de la mémoire n’est plus vraie (douleur disparue, habitude changée), supprime-la avec forget puis enregistre la nouvelle avec remember. Sers-toi de la mémoire pour personnaliser tes réponses, sans la réciter.
Actions : si ${n} dit avoir pris un traitement, appelle mark_dose ; s’il signale le passage de l’infirmier, log_nurse_visit ; s’il veut noter un rendez-vous, add_event. Confirme ensuite en une phrase.`}

async function compactChat(){if(S.chat.length<=40||!AI.sample||AI.off)return;const old=S.chat.slice(0,20);

async function ask(q){q=String(q||'').trim();if(!q||thinking)return;S.chat.push({me:1,t:q,at:new Date().toISOString()});thinking=true;streamText='';miloFace='n_attentif';save();render();scrollChat();

      if(c==='cancelled'){a=streamText?{k:'face',t:splitMood(streamText).t+' …'}:null}

const ACC={sb:null,user:null,avail:false,ready:false,apple:false,state:'',last:0,timer:0,busy:false,applying:false,err:''};

function loadScript(src){return new Promise((ok,ko)=>{if(document.querySelector(`script[src="${src}"]`)&&window.supabase)return ok();const s=document.createElement('script');s.src=src;s.async=true;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
async function accInit(){if(!HOSTED){ACC.ready=true;return}
  try{const r=await fetch('/api/config',{cache:'no-store'});if(!r.ok)throw 0;const c=await r.json();if(!c.url||!c.anonKey)throw 0;
    await loadScript(SB_JS);ACC.sb=window.supabase.createClient(c.url,c.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});ACC.avail=true;ACC.apple=!!c.apple;
    const {data}=await ACC.sb.auth.getSession();ACC.user=data.session?.user||null;
    ACC.sb.auth.onAuthStateChange((ev,sess)=>{const u=sess?.user||null,was=ACC.user?.id;ACC.user=u;
      if(ev==='PASSWORD_RECOVERY'){setTimeout(()=>accNewPassForm(),50);return}
      if(u&&u.id!==was)accPull();if(!u){ACC.state='';}accRefresh()});
    if(ACC.user)await accPull();

async function accPull(){if(!ACC.user||ACC.busy)return;ACC.busy=true;ACC.state='sync';accRefresh();
  try{const {data,error}=await ACC.sb.from('milo_state').select('data,updated_at').eq('user_id',ACC.user.id).maybeSingle();if(error)throw error;
    const remote=data&&data.data,rts=data?Date.parse(data.updated_at):0,mine=S._acct===ACC.user.id;
    if(!remote){S._acct=ACC.user.id;ACC.busy=false;await accPush();return}
    if(!mine&&S.onboarded&&S._ts&&Math.abs((S._ts||0)-rts)>2000){ACC.busy=false;ACC.state='ok';accChoose(remote,rts);return}
    if(!mine||rts>(S._ts||0)+500)accApply(remote,rts);else if((S._ts||0)>rts+500){ACC.busy=false;await accPush();return}
    ACC.state='ok';ACC.last=Date.now()}
  catch(e){ACC.state='err';ACC.err=accErr(e)}ACC.busy=false;accRefresh()}
function accApply(remote,rts){ACC.applying=true;S=Object.assign(DEFAULT(),remote);S._acct=ACC.user.id;S._ts=rts||Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  MEM.facts=Array.isArray(S.memory)?S.memory:[];ACC.applying=false;render();moveInd(true)}
function accQueue(){if(!ACC.user||ACC.applying)return;clearTimeout(ACC.timer);ACC.timer=setTimeout(accPush,1500)}
async function accPush(){if(!ACC.user)return;if(ACC.busy){accQueue();return}ACC.busy=true;ACC.state='sync';
  try{S._acct=ACC.user.id;const {error}=await ACC.sb.from('milo_state').upsert({user_id:ACC.user.id,data:S,updated_at:new Date(S._ts||Date.now()).toISOString()});if(error)throw error;ACC.state='ok';ACC.last=Date.now()}
  catch(e){ACC.state='err';ACC.err=accErr(e)}ACC.busy=false;const st=document.getElementById('accState');if(st)st.innerHTML=accStateTxt()}
function accStateTxt(){return ACC.state==='sync'?'Synchronisation…':ACC.state==='err'?`Synchronisation impossible pour l’instant${ACC.err?' : '+esc(ACC.err):''}`:ACC.last?`Synchronisé à ${new Date(ACC.last).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}`:'Données liées à ton compte'}
function accErr(e){const m=String(e&&(e.message||e.error_description||e)||'').toLowerCase();
  if(m.includes('invalid login'))return 'E-mail ou mot de passe incorrect.';if(m.includes('already registered')||m.includes('already been registered'))return 'Un compte existe déjà avec cet e-mail : connecte-toi.';
  if(m.includes('email not confirmed'))return 'Confirme d’abord ton adresse avec le lien reçu par e-mail.';if(m.includes('password')&&m.includes('6'))return 'Mot de passe trop court.';
  if(m.includes('rate')||m.includes('too many'))return 'Trop de tentatives, réessaie dans quelques minutes.';if(m.includes('fetch')||m.includes('network'))return 'Pas de connexion internet.';return 'Une erreur est survenue, réessaie.'}
function accChoose(remote,rts){modal('Quelles données garder ?',`<p class="sub" style="margin-top:0">Ton compte contient déjà des données (mises à jour le ${new Date(rts).toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}), et cet appareil aussi.</p>
  <div class="stack"><button class="btn full" data-act="accKeepRemote">${ic('download')}Garder les données du compte</button><button class="btn ghost full" data-act="accKeepLocal">${ic('upload')}Garder celles de cet appareil</button></div>
  <p class="tiny" style="margin-top:10px">L’autre version sera remplacée.</p>`,{face:'concentre'});ACC.pending={remote,rts}}

let accMode='login';
function accForm(mode){accMode=mode||accMode;const su=accMode==='signup';
  modal(su?'Créer mon compte':'Se connecter',`<p class="sub" style="margin-top:0">${su?'Retrouve tes traitements, ton suivi et la mémoire de Milo sur tous tes appareils.':'Content de te revoir ! Tes données se synchronisent dès la connexion.'}</p>
  <div class="stack"><button type="button" class="btn full auth-g" data-act="accGoogle">${G_SVG}Continuer avec Google</button>
  <button type="button" class="btn full auth-a" ${ACC.apple?'data-act="accApple"':'disabled aria-disabled="true"'}>${A_SVG}Continuer avec Apple${ACC.apple?'':' <span class="tiny" style="color:inherit;opacity:.7">· bientôt</span>'}</button></div>
  <div class="auth-or"><span>ou avec ton e-mail</span></div>
  <div class="tabs" style="margin-bottom:6px"><button type="button" class="${su?'':'on'}" data-act="accTab" data-v="login">Connexion</button><button type="button" class="${su?'on':''}" data-act="accTab" data-v="signup">Créer un compte</button></div>
  <form id="f">${su?'<label for="a_n">Prénom</label><input class="field" id="a_n" autocomplete="given-name" placeholder="Ton prénom">':''}
  <label for="a_e">E-mail</label><input class="field" id="a_e" type="email" autocomplete="email" required placeholder="prenom@exemple.fr">
  <label for="a_p">Mot de passe</label><input class="field" id="a_p" type="password" autocomplete="${su?'new-password':'current-password'}" required minlength="8" placeholder="${su?'8 caractères minimum':'Ton mot de passe'}">
  <div id="a_msg" class="tiny" style="margin-top:8px;min-height:16px;color:#c0392b"></div>
  <div class="actions"><button class="btn full" type="submit">${su?ic('sparkles')+'Créer mon compte':ic('check')+'Se connecter'}</button></div>
  ${su?'':'<button type="button" class="link" data-act="accForgot" style="margin-top:6px">Mot de passe oublié ?</button>'}</form>
  <p class="tiny" style="margin-top:12px">${ic('shield-check')} Tes données sont privées : toi seul peux les lire.${su?' En créant un compte, tu acceptes la':''} <a href="/confidentialite" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">${su?'politique de confidentialité':'Confidentialité'}</a>.</p>`,{face:'clin'});
  document.getElementById('f').onsubmit=async e=>{e.preventDefault();const em=val('a_e'),pw=document.getElementById('a_p').value,msg=document.getElementById('a_msg');
    if(pw.length<8){msg.textContent='Le mot de passe doit faire au moins 8 caractères.';return}msg.style.color='var(--muted)';msg.textContent='Un instant…';
    try{if(su){const name=val('a_n');const {data,error}=await ACC.sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname,data:name?{full_name:name}:{}}});if(error)throw error;
        if(name&&S.profile)S.profile.name=name;
        if(!data.session){msg.style.color='var(--green)';msg.textContent='Compte créé ! Clique sur le lien reçu par e-mail pour l’activer, puis connecte-toi.';return}}
      else{const {error}=await ACC.sb.auth.signInWithPassword({email:em,password:pw});if(error)throw error}
      close();toast(su?'Bienvenue dans ton compte Milo !':'Connexion réussie','n_heureux')}
    catch(err){msg.style.color='#c0392b';msg.textContent=accErr(err)}}}
function accNewPassForm(){modal('Nouveau mot de passe',`<form id="f"><label for="a_p">Nouveau mot de passe</label><input class="field" id="a_p" type="password" autocomplete="new-password" minlength="8" required placeholder="8 caractères minimum"><div id="a_msg" class="tiny" style="margin-top:8px;color:#c0392b"></div><div class="actions"><button class="btn full" type="submit">${ic('check')}Enregistrer</button></div></form>`,{face:'clin'});
  document.getElementById('f').onsubmit=async e=>{e.preventDefault();const pw=document.getElementById('a_p').value;if(pw.length<8){document.getElementById('a_msg').textContent='8 caractères minimum.';return}
    const {error}=await ACC.sb.auth.updateUser({password:pw});if(error){document.getElementById('a_msg').textContent=accErr(error);return}close();toast('Mot de passe modifié','n_heureux')}}
function accCard(){if(!ACC.ready)return '';
  if(!ACC.avail)return HOSTED?'':`<div class="card row acc-card"><div class="bubble">${ic('user')}</div><div class="grow"><div class="h-card">Compte Milo</div><div class="tiny">La connexion (Google, e-mail) est disponible sur la version en ligne de Milo.</div></div></div>`;
  if(!ACC.user)return `<button class="card acc-card acc-cta" data-act="accOpen"><div class="row"><div class="bubble">${ic("shield-check")}</div><div class="grow"><div class="h-card">Crée ton compte Milo</div><div class="tiny">Sauvegarde tes données et retrouve-les sur tous tes appareils.</div></div>${ic('chevron-right','chev')}</div></button>`;
  const u=ACC.user,nm=accName(u),ini=(nm||u.email||'?').trim().charAt(0).toUpperCase(),prov=(u.app_metadata?.provider||'email');
  return `<div class="card acc-card"><div class="row"><div class="acc-av">${ini}</div><div class="grow" style="min-width:0"><div class="h-card">${esc(nm||'Mon compte')}</div><div class="tiny" style="overflow:hidden;text-overflow:ellipsis">${esc(u.email||'')} · ${prov==='google'?'Google':prov==='apple'?'Apple':'E-mail'}</div><div class="tiny acc-st" id="accState">${accStateTxt()}</div></div></div>
    <div class="row" style="gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn ghost sm" data-act="accSyncNow">${ic('rotate-ccw')}Synchroniser</button><button class="btn ghost sm" data-act="accLogout">Se déconnecter</button><button class="btn ghost sm" data-act="accWipeAsk" style="color:#c0392b">Supprimer les données du compte</button></div></div>`}

/* ---------- Modales ---------- */
function modal(title,body,{face=''}={}){document.getElementById('layer').innerHTML=`<div class="modal" id="modal"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-top">${face?mimg(face,'','width:46px;height:46px'):''}<h2>${title}</h2><button class="icon-btn" data-act="close" aria-label="Fermer">${ic('x')}</button></div>${body}</div></div>`;const f=document.querySelector('#modal input,#modal select,#modal textarea');f&&setTimeout(()=>f.focus({preventScroll:true}),60)}
function close(){document.getElementById('layer').innerHTML=''}
const val=id=>document.getElementById(id)?.value.trim();
function toast(msg,face='heureux'){const el=document.createElement('div');el.className='toast';el.innerHTML=`${mimg(face)}<span>${esc(msg)}</span>`;document.getElementById('app').append(el);setTimeout(()=>el.remove(),2600)}

function medForm(id,draft){const src=draft||S.meds.find(x=>x.id===id)||{name:'',dose:'',form:'',posology:'',freq:'jour',wd:[],every:2,slots:['matin'],start:TODAY(),days:'',tint:'sky',note:''};
  const m=Object.assign({freq:'jour',wd:[],every:2,form:''},src),custom=(m.slots||[]).filter(s=>s[0]==='h').sort((a,b)=>slotMin(a)-slotMin(b));
  modal(id?'Modifier le traitement':'Nouveau traitement',`<form id="f">
  <label for="m_name">Traitement</label><input class="field" id="m_name" value="${esc(m.name)}" required placeholder="Nom du médicament ou du soin">
  <div class="f-row"><div><label for="m_form">Forme</label><select class="field" id="m_form"><option value="">Non précisée</option>${FORMS.map(f=>`<option ${m.form===f?'selected':''}>${f}</option>`).join('')}</select></div><div><label for="m_dose">Dosage</label><input class="field" id="m_dose" value="${esc(m.dose)}" placeholder="ex. 20 mg, 5 ml…"></div></div>
  <label for="m_pos">Posologie</label><input class="field" id="m_pos" value="${esc(m.posology)}" placeholder="ex. 1 comprimé matin et soir pendant le repas">
  <label for="m_freq">Fréquence</label><select class="field" id="m_freq">${[['jour','Tous les jours'],['sem','Certains jours de la semaine'],['n','Tous les … jours'],['besoin','Si besoin (sans horaire fixe)']].map(([v,l])=>`<option value="${v}" ${m.freq===v?'selected':''}>${l}</option>`).join('')}</select>
  <div id="m_wdbox" class="checks" style="margin-top:8px;${m.freq==='sem'?'':'display:none'}">${WD.map((l,i)=>`<label><input type="checkbox" name="wd" value="${i+1}" ${(m.wd||[]).includes(i+1)?'checked':''}>${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'][i]}</label>`).join('')}</div>
  <div id="m_nbox" style="margin-top:8px;${m.freq==='n'?'':'display:none'}"><label for="m_every" style="margin-top:0">Une prise tous les</label><div class="row" style="gap:8px"><input class="field" type="number" min="2" max="60" id="m_every" value="${m.every||2}" style="max-width:110px"><span class="tiny">jours, à partir de la date de début</span></div></div>
  <div id="m_slotbox" style="${m.freq==='besoin'?'display:none':''}">
    <label>Moments de prise</label><div class="checks">${SLOT_ORDER.map(s=>`<label><input type="checkbox" name="slot" value="${s}" ${(m.slots||[]).includes(s)?'checked':''}>${SLOT[s]} <span class="tiny">${slotTime(s).replace(':',' h ')}</span></label>`).join('')}${custom.map(s=>`<label><input type="checkbox" name="slot" value="${s}" checked>${slotLabel(s)}</label>`).join('')}</div>
    <div class="row" style="gap:8px;margin-top:8px"><input class="field" type="time" id="m_time" aria-label="Autre heure" style="max-width:150px"><button type="button" class="btn ghost sm" data-act="medAddTime">${ic('plus')}Ajouter une heure</button></div>
  </div>
  <div class="f-row"><div><label for="m_start">Début</label><input class="field" type="date" id="m_start" value="${m.start||''}"></div><div><label for="m_days">Durée (jours)</label><input class="field" type="number" min="1" id="m_days" value="${m.days||''}" placeholder="Sans limite"></div></div>
  <div class="f-row"><div><label for="m_tint">Couleur</label><select class="field" id="m_tint">${[['sky','Bleu'],['pink','Rose'],['orange','Orange'],['green','Vert'],['','Violet']].map(([v,l])=>`<option value="${v}" ${m.tint===v?'selected':''}>${l}</option>`).join('')}</select></div><div><label for="m_note">Note</label><input class="field" id="m_note" value="${esc(m.note||'')}" placeholder="Optionnel"></div></div>
  <div class="note" style="margin-top:12px">${ic('info')}<span>Tu peux noter tout traitement : médicament, soin, crème, kiné à domicile… Milo ne fait que te rappeler ce que tu enregistres. En cas de doute sur une dose, demande à ton médecin ou à ton pharmacien.</span></div>
  <div class="actions">${id?`<button type="button" class="btn danger" data-act="medDel" data-id="${id}">${ic('trash-2')}Supprimer</button>`:''}<button class="btn" type="submit">${ic('check')}Enregistrer</button></div></form>`,{face:'medic'});
  const fq=document.getElementById('m_freq'),show=()=>{const v=fq.value;document.getElementById('m_wdbox').style.display=v==='sem'?'':'none';document.getElementById('m_nbox').style.display=v==='n'?'':'none';document.getElementById('m_slotbox').style.display=v==='besoin'?'none':''};fq.onchange=show;
  const read=()=>({name:val('m_name'),dose:val('m_dose'),form:document.getElementById('m_form').value,posology:val('m_pos'),freq:fq.value,wd:[...document.querySelectorAll('[name=wd]:checked')].map(x=>Number(x.value)),every:Math.max(2,Number(val('m_every'))||2),tint:document.getElementById('m_tint').value,slots:[...document.querySelectorAll('[name=slot]:checked')].map(x=>x.value),start:val('m_start'),days:val('m_days'),note:val('m_note')});
  MED_FORM={id,read};
  document.getElementById('f').onsubmit=e=>{e.preventDefault();const d=read();
    if(!d.name){toast('Indique le nom du traitement','surpris');return}
    if(d.freq==='besoin')d.slots=[];else if(!d.slots.length){toast('Choisis au moins un moment de prise','surpris');return}
    if(d.freq==='sem'&&!d.wd.length){toast('Choisis au moins un jour de la semaine','surpris');return}
    if(id)Object.assign(S.meds.find(x=>x.id===id),d);else S.meds.push({id:uid(),...d});save();close();render();toast(id?'Traitement mis à jour':'Traitement ajouté','medic')}}
let MED_FORM=null;

  <div class="f-row"><div><label for="e_d">Date</label><input class="field" type="date" id="e_d" value="${e.date}" required></div><div><label for="e_h">Heure</label><input class="field" type="time" id="e_h" value="${e.time}"></div></div>

  <label for="e_n">Note</label><textarea class="field" id="e_n" placeholder="Adresse, questions à poser…">${esc(e.note)}</textarea>

  <div class="actions">${id?`<button type="button" class="btn danger" data-act="careDel" data-id="${id}">${ic('trash-2')}Supprimer</button>`:''}<button class="btn" type="submit">${ic('check')}Enregistrer</button></div></form>`,{face:'soin'});
  document.getElementById('f').onsubmit=e=>{e.preventDefault();const d={title:val('c_t'),date:val('c_d'),time:val('c_h'),note:val('c_n')};if(!d.title||!d.date){toast('Indique le soin et sa date','surpris');return}if(id)Object.assign(S.care.find(x=>x.id===id),d);else S.care.push({id:uid(),...d});save();close();render();toast('Soin enregistré','soin')}}
function nurseForm(){modal('Passage infirmier',`<form id="f"><label for="n_w">Créneau</label><input class="field" id="n_w" value="${esc(S.nurse.window)}"><label for="n_a">Soin réalisé</label><input class="field" id="n_a" value="${esc(S.nurse.act)}"><label for="n_u">Dernier jour prévu</label><input class="field" type="date" id="n_u" value="${S.nurse.until}"><div class="tiny" style="margin-top:6px">Laisse vide tant que la durée n’est pas confirmée.</div><div class="actions"><button class="btn" type="submit">${ic('check')}Enregistrer</button></div></form>`,{face:'soin'});

function setW(i,instant){welcomeStep=Math.max(0,Math.min(WEL.length-1,i));const tr=document.getElementById('wtrack');if(!tr)return;

function bindSwipe(){const vp=document.getElementById('wvp'),tr=document.getElementById('wtrack');let x0=null,y0=0,dx=0,t0=0,lock=null,pid=null;
  vp.addEventListener('pointerdown',e=>{x0=e.clientX;y0=e.clientY;dx=0;t0=performance.now();lock=null;pid=e.pointerId});
  vp.addEventListener('pointermove',e=>{if(x0===null||e.pointerId!==pid)return;const mx=e.clientX-x0,my=e.clientY-y0;
    if(lock===null&&(Math.abs(mx)>6||Math.abs(my)>6)){lock=Math.abs(mx)>Math.abs(my)?'x':'y';if(lock==='x'){try{vp.setPointerCapture(pid)}catch(_){}vp.classList.add('drag');tr.style.transition='none'}}
    if(lock!=='x')return;e.preventDefault();dx=mx;const edge=(welcomeStep===0&&dx>0)||(welcomeStep===WEL.length-1&&dx<0),eff=edge?dx*.3:dx;
    tr.style.transform=`translateX(calc(${-welcomeStep*100}% + ${eff}px))`;
    tr.querySelectorAll('.stage img.mascot').forEach((im,k)=>im.style.transform=`translateX(${(k-welcomeStep)*30+eff*.18}px)`)});
  const end=()=>{if(x0===null)return;const w=vp.clientWidth||1,v=dx/Math.max(1,performance.now()-t0);x0=null;vp.classList.remove('drag');
    if(lock==='x'){if(dx<-w*.18||v<-.45)setW(welcomeStep+1);else if(dx>w*.18||v>.45)setW(welcomeStep-1);else setW(welcomeStep)}lock=null};
  vp.addEventListener('pointerup',end);vp.addEventListener('pointercancel',end);vp.addEventListener('lostpointercapture',end)}

    <div class="list-row"><span class="grow tiny">Convalescence</span><b style="font-size:14px">${esc(p.intervention||(P?P[1]:'—'))}</b></div>
    <div class="list-row"><span class="grow tiny">Depuis le</span><b style="font-size:14px">${fmt(p.surgery)} · J+${pr.elapsed}</b></div>
    <div class="list-row"><span class="grow tiny">Fin d’immobilisation</span><b style="font-size:14px">${fmt(p.immobEnd)}</b>${p.immobConfirmed?'':'<span class="pill orange">à confirmer</span>'}</div>
   </div>${G.length?`<div class="row" style="flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0 6px">${G.map(g=>`<span class="pill">${ic(g[2])}${g[1]}</span>`).join('')}</div>`:''}
   <button class="btn full" style="font-size:16px;padding:15px;margin-top:14px" data-act="qdone">Découvrir mon espace ${ic('chevron-right')}</button></div></div>`}
/* ---------- Rendu & événements ---------- */
const VIEWS={accueil:vHome,traitements:vMeds,soins:vCare,calendrier:vCal,recuperation:vRecov,milo:vTalk,jeux:()=>window.MiloGames?MiloGames.view():'',profil:vProfile};
function render(){renderSide();document.getElementById('view').innerHTML=VIEWS[route]();const c=document.getElementById('composer');if(c)c.onsubmit=e=>{e.preventDefault();const i=document.getElementById('miloInput');ask(i.value);};const n=document.getElementById('notifToggle');if(n)n.onchange=()=>{S.prefs.notif=n.checked;save();toast(n.checked?'Rappels activés':'Rappels désactivés',n.checked?'acc3_interrupteur':'fatigue')}}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();close();go(g.dataset.go);return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==='close'){close();return}
  if(e.target.id==='modal'){close();return}
  switch(a){
  case 'preview':document.documentElement.classList.add('preview');break;
  case 'take':{S.intakes[b.dataset.k]=new Date().toISOString();save();render();const left=todayDoses().filter(d=>!d.taken).length;toast(left?'Prise notée ✓':'Toutes les prises du jour sont faites !',left?'n_heureux':'n_bravo');break}
  case 'untake':delete S.intakes[b.dataset.k];save();render();toast('Prise annulée','neutre');break;
  case 'accOpen':accForm('signup');break;
  case 'accTab':accForm(b.dataset.v);break;
  case 'accGoogle':ACC.sb&&ACC.sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});break;
  case 'accApple':ACC.sb&&ACC.sb.auth.signInWithOAuth({provider:'apple',options:{redirectTo:location.origin+location.pathname}});break;
  case 'accForgot':{const em=val('a_e'),msg=document.getElementById('a_msg');if(!em){msg.textContent='Indique d’abord ton e-mail.';break}ACC.sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname}).then(({error})=>{msg.style.color=error?'#c0392b':'var(--green)';msg.textContent=error?accErr(error):'E-mail envoyé : suis le lien pour choisir un nouveau mot de passe.'});break}
  case 'accSyncNow':accPull();break;
  case 'accLogout':clearTimeout(ACC.timer);accPush().finally(()=>ACC.sb.auth.signOut().then(()=>{ACC.user=null;ACC.last=0;render();toast('Tu es déconnecté. Tes données restent sur cet appareil.','neutre')}));break;
  case 'accWipeAsk':modal('Supprimer les données du compte ?',`<p class="sub" style="margin-top:0">Les données enregistrées sur ton compte seront effacées définitivement. Celles de cet appareil sont conservées.</p><div class="actions"><button class="btn ghost" data-act="close">Annuler</button><button class="btn danger" data-act="accWipe">${ic('trash-2')}Supprimer</button></div>`,{face:'concentre'});break;
  case 'accWipe':ACC.sb.from('milo_state').delete().eq('user_id',ACC.user.id).then(({error})=>{close();if(error){toast('Suppression impossible pour l’instant','surpris');return}delete S._acct;ACC.sb.auth.signOut();ACC.user=null;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render();toast('Données du compte supprimées','neutre')});break;
  case 'accKeepRemote':{const p=ACC.pending;ACC.pending=null;close();if(p)accApply(p.remote,p.rts);ACC.last=Date.now();accRefresh();toast('Données du compte récupérées','n_heureux');break}
  case 'accKeepLocal':{ACC.pending=null;close();S._acct=ACC.user.id;S._ts=Date.now();accPush().then(accRefresh);toast('Données de cet appareil enregistrées sur ton compte','n_heureux');break}
  case 'medAddTime':{const tm=val('m_time');if(!tm||!MED_FORM){toast('Choisis une heure','surpris');break}const d=MED_FORM.read(),k='h'+tm;if(!d.slots.includes(k))d.slots.push(k);medForm(MED_FORM.id,d);break}
  case 'takeNow':{const m=S.meds.find(x=>x.id===b.dataset.id);if(!m)break;S.intakes[ik(m.id,TODAY(),'b'+Date.now().toString(36))]=new Date().toISOString();save();render();toast(`${m.name} · prise notée`,'n_heureux');break}
  case 'medTab':medTab=b.dataset.v;render();break;
  case 'medEdit':medForm(id);break;
  case 'medDel':S.meds=S.meds.filter(m=>m.id!==id);save();close();render();toast('Traitement supprimé','neutre');break;
  case 'nurse':{const t=TODAY();if(S.nurse.log[t]){delete S.nurse.log[t];toast('Passage retiré','neutre')}else{S.nurse.log[t]=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});toast('Passage infirmier noté','soin')}save();render();break}
  case 'nurseEdit':nurseForm();break;
  case 'dress':{const d=b.dataset.d,i=S.dressing.done.indexOf(d);if(i>=0){S.dressing.done.splice(i,1);toast('Changement retiré','neutre')}else{S.dressing.done.push(d);toast('Pansement changé ✓','bravo')}save();render();break}
  case 'dressEdit':dressForm();break;
  case 'careEdit':careForm(id);break;
  case 'careDel':S.care=S.care.filter(c=>c.id!==id);save();close();render();toast('Soin supprimé','neutre');break;
  case 'calSel':calSel=b.dataset.d;render();break;
  case 'calMonth':{const [y,m]=calView.split('-').map(Number),d=new Date(y,m-1+Number(b.dataset.v),1);calView=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;render();break}
  case 'dayjump':calSel=b.dataset.d;calView=calSel.slice(0,7);go('calendrier');break;
  case 'evEdit':evForm(id,b.dataset.d);break;
  case 'evDel':S.events=S.events.filter(x=>x.id!==id);save();close();render();toast('Événement supprimé','neutre');break;
  case 'ask':ask(b.dataset.q);break;
  case 'stopAi':AI.ctl&&AI.ctl.abort();break;
  case 'memOpen':memForm();break;
  case 'memDel':MEM.facts=MEM.facts.filter(f=>f.id!==id);memSave();memForm();toast('Souvenir oublié','neutre');break;
  case 'memAllAsk':document.getElementById('memConfirm').innerHTML=`<div class="note" style="margin-top:12px;border-color:#f6d3dd">${ic('info')}<span>Milo oubliera tout ce que tu lui as confié. <button type="button" class="link" data-act="memAll" style="color:#c23a5e;padding:0">Confirmer</button></span></div>`;break;
  case 'memAll':MEM.facts=[];memSave();memForm();toast('Mémoire effacée','neutre');break;
  case 'welcome':close();showWelcome('replay');break;
  case 'quizAgain':close();showWelcome('first');startQuiz();break;
  case 'wstep':setW(Number(b.dataset.v));break;
  case 'wnext':if(welcomeStep<WEL.length-1)setW(welcomeStep+1);else welcomeEnd();break;
  case 'wdone':welcomeEnd();break;
  case 'qopt':{qRead();const k=b.dataset.k,v=b.dataset.v;if(k==='goals'){const g=Q.a.goals,ix=g.indexOf(v);ix>=0?g.splice(ix,1):g.push(v);drawQuizKeep()}else{Q.a[k]=v;drawQuizKeep();if(!['autre','date'].includes(v))setTimeout(()=>{if(QS[Q.i].id===k&&Q.a[k]===v)qNext()},380)}break}
  case 'qback':qRead();if(Q.i>0){Q.i--;Q.dir=-1;drawQuiz()}else{showWelcome('first');setW(WEL.length-1,true)}break;
  case 'qskip':qRead();if(Q.i<QS.length-1){Q.i++;Q.dir=1;drawQuiz()}else finishQuiz();break;
  case 'qlater':S.onboarded=true;save();close();go('accueil');toast('Tu pourras personnaliser ton suivi depuis les préférences.','clin');break;
  case 'qdone':close();go('accueil');toast(`Bienvenue ${S.profile.name} ! On commence.`,'heureux');break;
  case 'chatClear':S.chat=[];S.chatSummary='';miloFace='hero';save();memSave();render();break;
  case 'infoEdit':infoForm();break;
  case 'prefs':prefsForm();break;
  case 'docs':docsForm();break;
  case 'docDel':S.docs=S.docs.filter(d=>d.id!==id);save();render();docsForm();break;
  case 'data':dataForm();break;
  case 'help':helpForm();break;
  case 'gallery':galleryForm();break;
  case 'iconPick':iconForm();break;
  case 'iconSet':S.prefs.appIcon=b.dataset.v;save();render();iconForm();toast(b.dataset.v==='auto'?`Icône de saison : ${ICON_SET.find(x=>x[0]===seasonIcon())[1]}`:'Icône mise à jour','icon_'+iconKey());break;
  case 'copy':{const t=document.getElementById('dump');navigator.clipboard?.writeText(t.value).then(()=>toast('Sauvegarde copiée','heureux')).catch(()=>{t.select();toast('Texte sélectionné : copie-le','clin')});if(!navigator.clipboard){t.select()}break}
  case 'import':try{const o=JSON.parse(val('imp'));if(!o.profile||!o.meds)throw 0;S=Object.assign(DEFAULT(),o);save();close();render();toast('Sauvegarde restaurée','bravo')}catch(err){toast('Cette sauvegarde n’est pas lisible. Colle le texte complet copié depuis Milo.','surpris')}break;
  case 'reset':document.getElementById('resetConfirm').innerHTML=`<div class="note" style="margin-top:12px;border-color:#f6d3dd">${ic('info')}<span>Toutes les prises, notes et modifications seront effacées et les données initiales rechargées. <button class="link" data-act="resetYes" style="color:#c23a5e;padding:0">Confirmer la réinitialisation</button></span></div>`;break;
  case 'resetYes':S=DEFAULT();S.onboarded=true;save();close();go('accueil');toast('Données réinitialisées','neutre');break;
  }});
document.getElementById('layer').addEventListener('click',e=>{if(e.target.id==='modal')close()});
document.getElementById('exitPreview').onclick=()=>document.documentElement.classList.remove('preview');
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modal'))close();if(document.getElementById('wtrack')&&(e.key==='ArrowRight'||e.key==='ArrowLeft'))setW(welcomeStep+(e.key==='ArrowRight'?1:-1))});

const h=location.hash.slice(1);route=ROUTES[h]?h:'accueil';buildTabbar();render();aiInit();memInit();accInit();
if(h==='bienvenue'||!S.onboarded)showWelcome(S.onboarded?'replay':'first');else if(S.prefs.welcomeEach&&!ROUTES[h])showWelcome('replay');
</script>
</body></html>
